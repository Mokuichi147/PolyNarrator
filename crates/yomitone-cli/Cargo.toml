[package]
name = "yomitone-cli"
description = "小説の登場人物ごとに声を変えて読み上げる (コマンドライン)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "yomitone_cli"

[[bin]]
name = "yomitone"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
yomitone.workspace = true

[dev-dependencies]
serde_json = "1"
tempfile = "3"
