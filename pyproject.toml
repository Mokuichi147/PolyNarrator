[project]
name = "polynarrator"
version = "0.1.0"
description = "小説の登場人物ごとに声を変えて読み上げる"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "natsort>=8.4.0",
    "openai>=1.0.0",
    "typesafe-sdk>=0.7.0",
    "wyoming>=1.10.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
